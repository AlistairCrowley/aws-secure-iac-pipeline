name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: 
  group:  ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan code
        run: semgrep scan --config p/terraform --config p/github-actions --error --metrics=off

  trivy:
    name: SCA + IaC (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan dependencies and config
        run: trivy fs --scanners vuln,misconfig --exit-code 1 .

  checkov:
    name: IaC (Checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: bridgecrew/checkov:3.3.20@sha256:6d20ebbcde58b2dce6e3151a6771fefa4d468281fe442475455623f5799b9f53
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan Terraform
        run: checkov -d terraform --framework terraform --quiet --compact --skip-download

  suppression-guard:
    name: Suppression guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: New suppressions need a documented decision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          added=$(git diff "$BASE_SHA...$HEAD_SHA" | grep '^+' | grep -v '^+++' | grep -E 'checkov:[s]kip|trivy:[i]gnore|no[s]emgrep|gitleaks:[a]llow' || true)

          if [ -z "$added" ]; then
            echo "No new suppressions in this PR."
            exit 0
          fi

          echo "New suppressions in this PR:"
          echo "$added"

          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if grep -qxF 'docs/security-decisions.md' <<< "$changed"; then
            echo "docs/security-decisions.md is updated in this PR, so these are allowed."
            exit 0
          fi

          echo "::error::This PR adds suppressions without updating docs/security-decisions.md"
          exit 1
